.hd h1{font-family:'Reem Kufi';font-size:1.45rem;margin:0;line-height:1.3}.hd small{color:var(--muted)}
.hd .sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;margin:0 -4px 14px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:rgba(245,243,251,.85);backdrop-filter:blur(8px);border-radius:999px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 14px 26px -24px rgba(40,40,90,.7);margin-bottom:14px}
.card h2{font-family:'Reem Kufi';font-size:1.15rem;margin:0 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{border-radius:18px;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.kpi b{display:block;font-family:'Reem Kufi';font-size:1.8rem;line-height:1.2}.kpi span{color:var(--muted);font-size:.85rem}
.k1{background:linear-gradient(135deg,var(--sky),var(--surface))}.k2{background:linear-gradient(135deg,var(--mint),var(--surface))}.k3{background:linear-gradient(135deg,var(--lav),var(--surface))}.k4{background:linear-gradient(135deg,var(--rose),var(--surface))}
.bars{display:grid;gap:9px}
.br{display:grid;grid-template-columns:minmax(110px,32%) 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.br .tr{height:12px;border-radius:6px;background:rgba(58,56,102,.08);overflow:hidden}.br .tr i{display:block;height:100%;border-radius:6px}
.br em{font-style:normal;font-weight:700;text-align:start;font-size:.85rem}
.lst{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:start;width:100%}
.row .nm{flex:1;min-width:0}.row .nm b{display:block}.row .nm small{color:var(--muted);font-size:.8rem}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.p-good{background:#D7F2E3;color:#1E6B47}.p-mid{background:#FFF0D2;color:#8A4F12}.p-bad{background:#FBDDE5;color:#9B2C47}.p-off{background:#EEE;color:#777}.p-new{background:#E8E4FA;color:#4E3E99}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;background:var(--lav)}
.ring{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:radial-gradient(closest-side,#fff 74%,transparent 76%),conic-gradient(var(--c) calc(var(--p)*1%),rgba(58,56,102,.1) 0)}
.f{display:grid;gap:10px}
.f label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
.in:focus{outline:none;border-color:var(--gold)}
.btn{border:0;border-radius:999px;padding:9px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface)}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.gold{background:linear-gradient(135deg,#EBD68F,#C9A24B);color:var(--ink)}
.btn.warn{background:#fff;color:var(--warn);border:1.5px solid rgba(192,64,94,.35)}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cq{border:1px dashed var(--gold);border-radius:14px;padding:10px;display:grid;gap:6px;background:#FFFCF2}
.cq .o{display:flex;gap:6px;align-items:center}.cq .o input[type=radio]{width:18px;height:18px;accent-color:var(--good)}
.muted{color:var(--muted);font-size:.88rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .in{flex:1;min-width:150px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,28,60,.45);display:grid;place-items:end center;padding:10px}
.modal[hidden]{display:none}
.sheet{width:min(100%,640px);max-height:92vh;overflow:auto;background:var(--surface);border-radius:24px 24px 16px 16px;padding:16px 16px 24px}
.sheet .x{float:left}
.wq{padding:8px 10px;border-radius:10px;background:#FFF4F6;border:1px solid #F6D3DC;font-size:.9rem}
.verse{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.verse .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--butter);font-weight:700;font-size:.85rem;flex:none}
.verse .t{flex:1;font-family:Amiri,serif;font-size:1.1rem}
.verse{flex-wrap:wrap}.verse audio{height:34px;width:100%;order:9}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(100%,380px);text-align:center;display:grid;gap:12px;padding:24px}
.login .logo{justify-self:center;width:80px;height:80px}
.err{color:var(--warn);font-weight:700;min-height:1.4em}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-weight:700;box-shadow:0 10px 20px -10px #000}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}th{color:var(--muted);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:2px;height:40px}.spark i{flex:1;background:var(--lav);border-radius:2px 2px 0 0;min-height:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted);margin-top:6px}

    if(d.activity.length){var c4=E('div','card');c4.appendChild(E('h2',null,'نشاطها في آخر ٣٠ يومًا'));var mx=Math.max.apply(null,d.activity.map(function(x){return x.n;}));var sp=E('div','spark');d.activity.forEach(function(x){var i=E('i');i.style.height=(x.n*100/mx)+'%';i.title=x.d+': '+x.n;sp.appendChild(i);});c4.appendChild(sp);body.appendChild(c4);}
    var c2=E('div','card');c2.appendChild(E('h2',null,'الواجبات'));
    if(!d.subs.length)c2.appendChild(E('p','muted','لم تُسلّم واجبات بعد.'));else{var t=H('<table><tr><th>الواجب</th><th>الدرجة</th><th>المحاولات</th></tr></table>');d.subs.forEach(function(x){t.appendChild(TR('<tr><td>'+esc(x.title)+'</td><td>'+ar(x.score)+' / '+ar(x.total)+'</td><td>'+ar(x.tries)+'</td></tr>'));});c2.appendChild(t);}
    body.appendChild(c2);
    var c3=E('div','card');c3.appendChild(E('h2',null,'آخر أخطائها'));
    if(!d.wrong.length)c3.appendChild(E('p','muted','لا أخطاء مسجّلة.'));else{var l=E('div','lst');d.wrong.forEach(function(x){l.appendChild(H('<div class="wq">'+esc(x.question)+' <small class="muted">· '+(SN[x.station]||'واجب')+'</small></div>'));});c3.appendChild(l);}
    body.appendChild(c3);
    var c5=E('div','card');c5.appendChild(E('h2',null,'تعديل'));
    var f=H('<form class="f"><label>الاسم<input class="in" name="n"></label><label>الحلقة<input class="in" name="c"></label><label>رمز سري جديد (اتركيه فارغًا لإبقاء القديم)<input class="in" name="p" inputmode="numeric"></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">حفظ</button><button type="button" class="btn warn" id="tg"></button></div></form>');
    f.n.value=g.name;f.c.value=g.circle||'';var tg=f.querySelector('#tg');tg.textContent=g.active?'إيقاف حسابها':'إعادة تفعيلها';
    function save(active){rpc('admin_save_student',{p_token:TOK,p_id:g.id,p_name:f.n.value,p_pin:f.p.value||null,p_circle:f.c.value,p_active:active}).then(function(r){if(!r.ok){toast({DUP:'الاسم موجود',PIN:'الرمز ٤ إلى ٨ أرقام'}[r.error]||'تعذّر الحفظ');return;}toast('تم الحفظ');document.querySelector('.modal').remove();load().then(render);});}
    f.onsubmit=function(e){e.preventDefault();save(g.active);};tg.onclick=function(){if(confirm(g.active?'إيقاف حساب «'+g.name+'»؟ لن تستطيع الدخول، وتبقى بياناتها.':'إعادة تفعيل حسابها؟'))save(!g.active);};
    c5.appendChild(f);body.appendChild(c5);
  }).catch(function(e){console.error(e);body.textContent='تعذّر التحميل';});
}
/* ===== الواجبات ===== */
function vHw(w){
  var c=E('div','card');c.appendChild(E('h2',null,'واجب جديد'));
  var f=H('<form class="f"><label>العنوان<input class="in" name="t" required placeholder="مثل: واجب النون الساكنة"></label><label>ملاحظة للبنات (اختياري)<textarea class="in" name="no" rows="2"></textarea></label><div><b style="font-size:.9rem">أسئلة عشوائية من محطات:</b><div class="chips" id="st" style="margin-top:6px"></div></div><label>عدد الأسئلة العشوائية<input class="in" name="q" type="number" min="0" max="50" value="10"></label><div><b style="font-size:.9rem">أسئلة من عندكِ:</b><div id="cqs" class="lst" style="margin-top:6px"></div><button type="button" class="btn sec" id="addq" style="margin-top:8px">+ إضافة سؤال</button></div><label>آخر موعد (اختياري)<input class="in" name="d" type="date"></label><label>لمن؟<select class="in" name="to"><option value="">كل البنات</option></select></label><button class="btn gold">إرسال الواجب</button></form>');
  var sel={};var st=f.querySelector('#st');STN.forEach(function(x){var b=E('button','chip',x[1]);b.type='button';b.setAttribute('aria-pressed','false');b.onclick=function(){sel[x[0]]=!sel[x[0]];b.setAttribute('aria-pressed',!!sel[x[0]]);};st.appendChild(b);});
  DATA.circles.forEach(function(x){var o=E('option',null,'حلقة: '+x);o.value='c:'+x;f.to.appendChild(o);});
  DATA.students.filter(function(s){return s.active;}).forEach(function(s){var o=E('option',null,'البنت: '+s.name);o.value='s:'+s.id;f.to.appendChild(o);});
  var cqs=f.querySelector('#cqs');
  f.querySelector('#addq').onclick=function(){var n=cqs.children.length;var q=H('<div class="cq"><input class="in" placeholder="نص السؤال" data-q><div class="o"><input type="radio" name="r'+n+'" checked><input class="in" placeholder="الجواب الصحيح" data-o></div><div class="o"><input type="radio" name="r'+n+'"><input class="in" placeholder="خيار آخر" data-o></div><div class="o"><input type="radio" name="r'+n+'"><input class="in" placeholder="خيار آخر" data-o></div><small class="muted">اختاري الدائرة بجانب الجواب الصحيح</small><button type="button" class="btn warn" style="justify-self:start;padding:4px 14px">حذف السؤال</button></div>');q.querySelector('.btn').onclick=function(){q.remove();};cqs.appendChild(q);};
  f.onsubmit=function(e){e.preventDefault();
    var custom=[].map.call(cqs.children,function(q){var os=[].map.call(q.querySelectorAll('[data-o]'),function(i){return i.value.trim();}),rs=[].map.call(q.querySelectorAll('input[type=radio]'),function(r){return r.checked;});
      var keep=[],a=0;os.forEach(function(o,i){if(o){if(rs[i])a=keep.length;keep.push(o);}});return {q:q.querySelector('[data-q]').value.trim(),o:keep,a:a};}).filter(function(x){return x.q&&x.o.length>=2;});
    var stations=Object.keys(sel).filter(function(k){return sel[k];}),qc=stations.length?+f.q.value||0:0;
    if(!custom.length&&!qc){toast('اختاري محطة أو أضيفي سؤالًا');return;}
    var to=f.to.value,circle=to.indexOf('c:')===0?to.slice(2):null,studs=to.indexOf('s:')===0?[to.slice(2)]:null;
    rpc('admin_save_assignment',{p_token:TOK,p_title:f.t.value,p_note:f.no.value,p_stations:stations,p_qcount:qc,p_custom:custom,p_due:f.d.value?new Date(f.d.value+'T23:59:00').toISOString():null,p_circle:circle,p_students:studs})
      .then(function(r){if(!r.ok){toast('تعذّر الحفظ');return;}toast('تم إرسال الواجب 🌸');load().then(render);}).catch(function(){toast('تعذّر الاتصال');});};
  c.appendChild(f);w.appendChild(c);
  var c2=E('div','card');c2.appendChild(E('h2',null,'الواجبات المرسلة'));var l=E('div','lst');
  if(!DATA.assignments.length)l.appendChild(E('p','muted','لم تُرسَل واجبات بعد.'));
  DATA.assignments.forEach(function(a){var p=a.avg!=null?Math.round(a.avg*100):null;
    var r=H('<button class="row"><div class="ring" style="--p:'+(p||0)+';--c:'+colorFor(p)+'">'+(p==null?'—':ar(p)+'٪')+'</div><div class="nm"><b>'+esc(a.title)+'</b><small>سلّمته '+ar(a.subs)+(a.target_circle?' · حلقة '+esc(a.target_circle):'')+(a.due_at?' · حتى '+ar(new Date(a.due_at).toLocaleDateString('ar')):'')+'</small></div><span class="pill '+(a.active?'p-good':'p-off')+'">'+(a.active?'مفعّل':'مخفي')+'</span></button>');
    r.onclick=function(){openHw(a);};l.appendChild(r);});
  c2.appendChild(l);w.appendChild(c2);
}
function openHw(a){
  var s=sheet();s.appendChild(H('<h2 style="font-family:Reem Kufi;margin:0">'+esc(a.title)+'</h2>'));var body=E('div','','جارٍ التحميل…');s.appendChild(body);
  rpc('admin_assignment',{p_token:TOK,p_id:a.id}).then(function(d){body.innerHTML='';
    var done=d.rows.filter(function(r){return r.score!=null;}).length;body.appendChild(E('p','muted','سلّمته '+ar(done)+' من '+ar(d.rows.length)));
    var t=H('<table><tr><th>البنت</th><th>الدرجة</th><th>المحاولات</th></tr></table>');
    d.rows.sort(function(x,y){return (y.score!=null)-(x.score!=null);}).forEach(function(r){t.appendChild(TR('<tr><td>'+esc(r.name)+'</td><td>'+(r.score==null?'<span class="pill p-bad">لم تسلّم</span>':ar(r.score)+' / '+ar(r.total))+'</td><td>'+(r.tries?ar(r.tries):'—')+'</td></tr>'));});
    var c=E('div','card');c.appendChild(t);body.appendChild(c);
    var c2=E('div','card');c2.appendChild(E('h2',null,'أكثر الأسئلة خطأً في هذا الواجب'));qList(c2,d.missed);body.appendChild(c2);
    var b=E('button','btn '+(a.active?'warn':'sec'),a.active?'إخفاء الواجب عن البنات':'إظهاره مرة أخرى');b.onclick=function(){rpc('admin_toggle_assignment',{p_token:TOK,p_id:a.id,p_active:!a.active}).then(function(){document.querySelector('.modal').remove();load().then(render);});};body.appendChild(b);
  });
}
/* ===== الأسئلة الصعبة ===== */
function vQs(w){var c=E('div','card');c.appendChild(E('h2',null,'الأسئلة التي تخطئ فيها البنات أكثر'));c.appendChild(E('p','muted','من البوابات وبنك الأسئلة والواجبات، للبنات المفعّلات فقط.'));qList(c,DATA.missed);w.appendChild(c);}

  f.onsubmit=function(e){e.preventDefault();rpc('admin_change_pin',{p_token:TOK,p_pin:f.querySelector('input').value}).then(function(r){toast(r.ok?'تم تغيير الرمز':'الرمز قصير');});};c2.appendChild(f);w.appendChild(c2);
  var c3=E('div','card');var lo=E('button','btn warn','تسجيل الخروج');lo.onclick=logout;c3.appendChild(lo);w.appendChild(c3);

if(TOK)boot();else render();
